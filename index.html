<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina Wheel 2D - 夢幻雙輪字母配對樂園</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Fredoka & Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- Canvas Confetti Library for Streamers Celebration -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * {
            font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: radial-gradient(circle at 50% 30%, #1e1035, #0a0612);
            min-height: 100vh;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        /* Glassmorphism Styling */
        .glass-panel {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4),
                        inset 0 1px 1px rgba(255, 255, 255, 0.3);
        }

        .glass-button {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0.08));
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25),
                        inset 0 1px 2px rgba(255, 255, 255, 0.4);
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .glass-button:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0.15));
            box-shadow: 0 10px 28px rgba(255, 105, 180, 0.4),
                        inset 0 1px 3px rgba(255, 255, 255, 0.7);
            transform: translateY(-2px) scale(1.02);
        }

        .glass-button:active {
            transform: translateY(1px) scale(0.97);
        }

        .glass-input {
            background: rgba(15, 10, 30, 0.6);
            border: 1.5px solid rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(12px);
            color: #fff;
            transition: all 0.2s ease;
        }

        .glass-input:focus {
            outline: none;
            border-color: rgba(255, 150, 220, 0.8);
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.4);
        }

        .glow-text {
            text-shadow: 0 0 18px rgba(255, 182, 193, 0.8), 0 0 30px rgba(0, 223, 216, 0.5);
        }

        /* Pulsing Glow for Matched State */
        .match-glow {
            animation: glowPulse 1.2s infinite alternate;
        }

        @keyframes glowPulse {
            from { box-shadow: 0 0 20px rgba(255, 215, 0, 0.4), inset 0 0 15px rgba(255, 215, 0, 0.3); }
            to { box-shadow: 0 0 45px rgba(255, 105, 180, 0.9), inset 0 0 25px rgba(0, 255, 255, 0.6); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 182, 193, 0.4); border-radius: 10px; }
    </style>
</head>
<body class="text-slate-100 flex flex-col justify-between p-3 md:p-6 min-h-screen">

    <!-- HEADER BAR -->
    <header class="glass-panel rounded-3xl p-4 flex flex-wrap justify-between items-center gap-3 max-w-6xl mx-auto w-full z-20">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-pink-400 via-purple-400 to-cyan-300 flex items-center justify-center text-white text-2xl shadow-lg shadow-pink-500/40">
                <i class="fa-solid fa-shapes"></i>

            <div>

                <p class="text-xs text-pink-200/80 font-light">雙輪字母配對 • 成功噴彩帶慶祝 🎉</p>

        <!-- Header Quick Tools -->

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 md:gap-12 w-full justify-items-center items-center">
            
            <!-- WHEEL 1 (CAPITAL A-Z) -->

                <div class="flex justify-between items-center w-full px-2">
                    <span class="text-sm font-extrabold text-pink-300 flex items-center gap-2">
                        <i class="fa-solid fa-font"></i> <span id="wheelTitle0">大寫字母 (A-Z)</span>

                <div class="flex justify-between items-center w-full px-2">
                    <span class="text-sm font-extrabold text-cyan-300 flex items-center gap-2">
                        <i class="fa-solid fa-text-height"></i> <span id="wheelTitle1">小寫字母 (a-z)</span>
                    </span>
                    <span id="resultBadge1" class="text-xs font-black bg-cyan-500/30 text-cyan-200 border border-cyan-400/40 px-3 py-1 rounded-full">

                    </span>
                </div>

                <!-- 2D Canvas Wheel 2 -->
                <div class="relative flex items-center justify-center my-2">
                    <!-- Top Pointer -->
                    <div class="absolute -top-3 z-10 w-0 h-0 border-l-[14px] border-l-transparent border-r-[14px] border-r-transparent border-t-[28px] border-t-pink-400 drop-shadow-[0_4px_8px_rgba(255,105,180,0.6)]"></div>
                    <!-- Wheel Canvas -->
                    <canvas id="canvas1" width="340" height="340" class="w-[280px] h-[280px] sm:w-[320px] sm:h-[320px] rounded-full drop-shadow-2xl"></canvas>
                </div>

                <button onclick="spinSingleWheel(1)" class="glass-button w-full py-2.5 rounded-2xl font-bold text-xs text-cyan-200 hover:text-white flex items-center justify-center gap-2">
                    <i class="fa-solid fa-rotate"></i> 轉動小寫轉盤

            </div>

        </div>

    </main>

    <!-- DUAL SPIN ACTION BAR AT BOTTOM -->
    <div class="max-w-md mx-auto w-full z-20 flex justify-center mb-2">
        <button id="dualSpinBtn" onclick="spinBothWheels()" class="w-full py-4 px-8 rounded-3xl font-black text-base md:text-lg text-white bg-gradient-to-r from-pink-500 via-purple-500 to-cyan-400 hover:from-pink-400 hover:via-purple-400 hover:to-cyan-300 shadow-[0_0_30px_rgba(255,105,180,0.5)] border border-white/40 transform active:scale-95 transition-all duration-200 flex items-center justify-center gap-3 group">
            <i class="fa-solid fa-bolt-lightning text-xl group-hover:rotate-12 transition-transform"></i>
            <span>同時轉動雙輪 (配對對決！)</span>
        </button>
    </div>

    <!-- SETTINGS SIDEBAR -->
    <div id="settingsSidebar" class="fixed inset-0 z-40 bg-black/60 backdrop-blur-md hidden flex justify-end">
        <div class="glass-panel w-full max-w-md h-full p-6 flex flex-col gap-5 overflow-y-auto border-l border-white/20">
            
            <div class="flex justify-between items-center border-b border-white/10 pb-4">
                <h2 class="text-base font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-pink-300"></i> 轉盤數據內容設定
                </h2>
                <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white text-xl">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Select Active Editing Wheel -->
            <div class="flex gap-2">
                <button id="editTab0" onclick="switchEditingWheel(0)" class="flex-1 py-2 rounded-xl text-xs font-bold glass-button text-pink-300">
                    編輯大寫轉盤

                <button id="editTab1" onclick="switchEditingWheel(1)" class="flex-1 py-2 rounded-xl text-xs font-bold glass-button text-cyan-300">
                    編輯小寫轉盤
                </button>
            </div>

            <!-- Title Field -->
            <div class="flex flex-col gap-1">
                <label class="text-xs text-pink-200 font-semibold">轉盤名稱</label>
                <input type="text" id="wheelTitleInput" onchange="updateCurrentWheelTitle(this.value)" class="glass-input w-full px-3 py-2 rounded-xl text-xs">
            </div>

            <!-- Quick Preset Reset -->
            <div class="flex flex-col gap-2">
                <label class="text-xs text-pink-200 font-semibold">快速預設載入</label>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="resetAlphabetPresets()" class="glass-button text-xs py-2 rounded-xl text-yellow-200">🔤 重置字母 A-Z / a-z</button>
                    <button onclick="loadFoodPresets()" class="glass-button text-xs py-2 rounded-xl text-emerald-200">🥞 美食配對預設</button>
                </div>
            </div>

            <!-- Options Textarea -->
            <div class="flex flex-col gap-1.5">
                <div class="flex justify-between items-center">
                    <label class="text-xs text-pink-200 font-semibold">選項內容 (一行一個)</label>
                    <span id="itemCountBadge" class="text-[11px] bg-pink-950/60 text-pink-300 border border-pink-500/30 px-2.5 py-0.5 rounded-lg">26 個選項</span>
                </div>
                <textarea id="wheelItemsTextarea" oninput="updateCurrentWheelItems(this.value)" rows="9" class="glass-input w-full p-3 rounded-2xl text-xs leading-relaxed resize-none"></textarea>
            </div>

            <button onclick="toggleSidebar()" class="glass-button w-full py-3 rounded-2xl font-bold text-xs text-white mt-auto">

    </div>

    <!-- MATCH CELEBRATION MODAL -->
    <div id="matchModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-md hidden opacity-0 transition-all duration-300">
        <div class="glass-panel rounded-3xl max-w-sm w-full p-6 flex flex-col items-center gap-4 border-2 border-yellow-300/60 shadow-[0_0_50px_rgba(255,215,0,0.5)] text-center transform scale-90 transition-transform duration-300" id="matchModalContent">
            
            <div class="w-20 h-20 rounded-full bg-gradient-to-tr from-yellow-400 via-pink-400 to-cyan-300 flex items-center justify-center text-white text-4xl shadow-lg shadow-pink-500/50 animate-bounce">
                <i class="fa-solid fa-crown"></i>
            </div>

            <div>
                <span class="text-xs font-bold text-yellow-300 uppercase tracking-widest">🎯 完美配對成功！</span>
                <h3 class="text-3xl md:text-4xl font-black text-white mt-2 bg-clip-text text-transparent bg-gradient-to-r from-yellow-200 via-pink-200 to-cyan-200 glow-text" id="matchPairText">
                    A ❤️ a
                </h3>
            </div>

            <p class="text-xs text-pink-100/90 leading-relaxed">
                太幸運了！兩個轉盤剛好停在同一個配對字母！🎉
            </p>

            <button onclick="closeMatchModal()" class="glass-button w-full py-3 rounded-2xl font-black text-sm text-yellow-200 bg-white/10 hover:bg-white/20 mt-2">
                太棒了！繼續挑戰
            </button>
        </div>
    </div>

    <script>
        /* SOUND SYNTHESIZER ENGINE */
        class CuteSoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playTickPop() {
                if (!this.enabled) return;
                this.init();

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(650 + Math.random() * 200, now);
                osc.frequency.exponentialRampToValueAtTime(140, now + 0.035);

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.04);
            }

            playMatchFanfare() {
                if (!this.enabled) return;
                this.init();

                const now = this.ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98]; // C5 to G6
                
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.07);

                    gain.gain.setValueAtTime(0.25, now + idx * 0.07);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.4);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now + idx * 0.07);
                    osc.stop(now + idx * 0.07 + 0.42);
                });
            }
        }

        const soundEngine = new CuteSoundEngine();

        /* PALETTE COLORS */
        const COLORS = [
            '#ff9aa2', '#ffb7b2', '#ffdac1', '#e2f0cb', '#b5ead7', '#c7ceea',
            '#f72585', '#7209b7', '#4cc9f0', '#4895ef', '#ffd166', '#06d6a0'
        ];

        /* APP STATE */
        const UPPER_ALPHABET = Array.from({length: 26}, (_, i) => String.fromCharCode(65 + i)); // A-Z
        const LOWER_ALPHABET = Array.from({length: 26}, (_, i) => String.fromCharCode(97 + i)); // a-z

        const wheels = [
            {
                title: '大寫字母 (A-Z)',
                items: [...UPPER_ALPHABET],
                rotation: 0,
                velocity: 0,
                isSpinning: false,
                winnerItem: null,
                lastPassedSegment: -1,
                theme: ['#ff85a1', '#fbb1bd', '#f7cad0', '#70d6ff', '#ff70a6', '#ff9770']
            },
            {
                title: '小寫字母 (a-z)',
                items: [...LOWER_ALPHABET],
                rotation: 0,
                velocity: 0,
                isSpinning: false,
                winnerItem: null,
                lastPassedSegment: -1,
                theme: ['#70d6ff', '#ff70a6', '#ff9770', '#ffd670', '#e9ff70', '#b8c0ff']
            }
        ];

        let currentEditingIndex = 0;

        function draw2DWheel(index) {
            const wheel = wheels[index];
            const canvas = document.getElementById(`canvas${index}`);
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            const centerX = width / 2;
            const centerY = height / 2;
            const radius = width / 2 - 12;

            ctx.clearRect(0, 0, width, height);

            const items = wheel.items.length > 0 ? wheel.items : ['無資料'];
            const numSegments = items.length;
            const anglePerSegment = (Math.PI * 2) / numSegments;

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(wheel.rotation);

            // Draw Slices
            for (let i = 0; i < numSegments; i++) {
                const startAngle = i * anglePerSegment - Math.PI / 2;
                const endAngle = startAngle + anglePerSegment;
                const colorHex = wheel.theme[i % wheel.theme.length];

                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radius, startAngle, endAngle);
                ctx.closePath();

                // Slice Color Gradient
                const grad = ctx.createRadialGradient(0, 0, 10, 0, 0, radius);
                grad.addColorStop(0, colorHex);
                grad.addColorStop(1, adjustColor(colorHex, -20));

                ctx.fillStyle = grad;
                ctx.fill();

                // Slice Border
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Text Label
                ctx.save();
                ctx.rotate(startAngle + anglePerSegment / 2);
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#ffffff';

                const fontSize = Math.max(14, Math.min(24, Math.floor(260 / Math.sqrt(numSegments))));
                ctx.font = `bold ${fontSize}px "Fredoka", "Noto Sans TC", sans-serif`;

                ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
                ctx.shadowBlur = 6;

                const label = items[i];
                ctx.fillText(label, radius - 20, 0);
                ctx.restore();
            }

            ctx.restore();

            // Outer Glass Rim
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.lineWidth = 8;
            ctx.stroke();

            // Center Knob
            ctx.beginPath();
            ctx.arc(centerX, centerY, 28, 0, Math.PI * 2);
            const knobGrad = ctx.createRadialGradient(centerX, centerY, 2, centerX, centerY, 28);
            knobGrad.addColorStop(0, '#ffffff');
            knobGrad.addColorStop(1, '#ff85a1');
            ctx.fillStyle = knobGrad;
            ctx.fill();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.lineWidth = 4;
            ctx.stroke();
        }

        function adjustColor(hex, percent) {
            let num = parseInt(hex.replace('#', ''), 16),
                amt = Math.round(2.55 * percent),
                R = (num >> 16) + amt,
                G = (num >> 8 & 0x00FF) + amt,
                B = (num & 0x0000FF) + amt;
            return '#' + (0x1000000 + (R<255?R<1?0:R:255)*0x10000 + (G<255?G<1?0:G:255)*0x100 + (B<255?B<1?0:B:255)).toString(16).slice(1);
        }

        function spinSingleWheel(index) {
            const wheel = wheels[index];
            if (wheel.isSpinning || wheel.items.length < 1) return;

            soundEngine.init();
            wheel.isSpinning = true;
            wheel.winnerItem = null;
            wheel.velocity = 0.35 + Math.random() * 0.2;
            wheel.friction = 0.985 + Math.random() * 0.003;
            wheel.lastPassedSegment = -1;

            document.getElementById(`resultBadge${index}`).innerText = '旋轉中...';
            document.getElementById(`wheelCard${index}`).classList.remove('match-glow');
        }

        function spinBothWheels() {
            spinSingleWheel(0);
            spinSingleWheel(1);
        }

        function updateAnimationLoop() {
            requestAnimationFrame(updateAnimationLoop);

            wheels.forEach((wheel, idx) => {
                if (wheel.isSpinning) {
                    wheel.rotation += wheel.velocity;
                    wheel.rotation %= (Math.PI * 2);
                    wheel.velocity *= wheel.friction;

                    // Tick Sound Check
                    const numSegments = wheel.items.length;
                    const anglePerSegment = (Math.PI * 2) / numSegments;
                    
                    let normalizedAngle = (-wheel.rotation) % (Math.PI * 2);
                    if (normalizedAngle < 0) normalizedAngle += Math.PI * 2;

                    const currentSegment = Math.floor(normalizedAngle / anglePerSegment);

                    if (currentSegment !== wheel.lastPassedSegment) {
                        soundEngine.playTickPop();
                        wheel.lastPassedSegment = currentSegment;
                    }

                    // Stop Condition
                    if (wheel.velocity < 0.001) {
                        wheel.isSpinning = false;
                        wheel.velocity = 0;

                        const winningItem = wheel.items[currentSegment] || '無';
                        wheel.winnerItem = winningItem;

                        document.getElementById(`resultBadge${idx}`).innerText = `開出: ${winningItem}`;

                        checkMatchedPair();
                    }
                }

                draw2DWheel(idx);
            });
        }

        function checkMatchedPair() {
            // Check if both wheels have finished spinning and produced results
            if (!wheels[0].isSpinning && !wheels[1].isSpinning && wheels[0].winnerItem && wheels[1].winnerItem) {
                const item1 = wheels[0].winnerItem;
                const item2 = wheels[1].winnerItem;

                // Match condition (e.g. 'A' matches 'a' OR exact match)
                if (item1.toUpperCase() === item2.toUpperCase()) {
                    
                    // Highlight both wheel cards
                    document.getElementById('wheelCard0').classList.add('match-glow');
                    document.getElementById('wheelCard1').classList.add('match-glow');

                    // Play celebration fanfare
                    soundEngine.playMatchFanfare();

                    // Trigger Confetti Streamers Fireworks! 🎉
                    fireConfettiStreamers();

                    // Show Celebration Modal
                    setTimeout(() => {
                        showMatchModal(`${item1} ❤️ ${item2}`);
                    }, 300);
                }
            }
        }

        function fireConfettiStreamers() {
            if (typeof confetti === 'function') {
                // Multi-burst colorful streamer confetti
                const duration = 2.5 * 1000;
                const end = Date.now() + duration;

                (function frame() {
                    confetti({
                        particleCount: 7,
                        angle: 60,
                        spread: 55,
                        origin: { x: 0, y: 0.7 }
                    });
                    confetti({
                        particleCount: 7,
                        angle: 120,
                        spread: 55,
                        origin: { x: 1, y: 0.7 }
                    });

                    if (Date.now() < end) {
                        requestAnimationFrame(frame);
                    }
                })();
            }
        }

        function showMatchModal(pairText) {
            document.getElementById('matchPairText').innerText = pairText;
            const modal = document.getElementById('matchModal');
            const content = document.getElementById('matchModalContent');

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-90');
                content.classList.add('scale-100');
            }, 10);
        }

        function closeMatchModal() {
            const modal = document.getElementById('matchModal');
            const content = document.getElementById('matchModalContent');

            modal.classList.add('opacity-0');
            content.classList.remove('scale-100');
            content.classList.add('scale-90');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('settingsSidebar');
            if (sidebar.classList.contains('hidden')) {
                sidebar.classList.remove('hidden');
                switchEditingWheel(currentEditingIndex);
            } else {
                sidebar.classList.add('hidden');
            }
        }

        function switchEditingWheel(index) {
            currentEditingIndex = index;
            const wheel = wheels[index];

            document.getElementById('editTab0').className = index === 0 
                ? 'flex-1 py-2 rounded-xl text-xs font-bold glass-button text-pink-300 border-pink-400' 
                : 'flex-1 py-2 rounded-xl text-xs font-bold glass-button text-slate-400';

            document.getElementById('editTab1').className = index === 1 
                ? 'flex-1 py-2 rounded-xl text-xs font-bold glass-button text-cyan-300 border-cyan-400' 
                : 'flex-1 py-2 rounded-xl text-xs font-bold glass-button text-slate-400';

            document.getElementById('wheelTitleInput').value = wheel.title;
            document.getElementById('wheelItemsTextarea').value = wheel.items.join('\n');
            document.getElementById('itemCountBadge').innerText = `${wheel.items.length} 個選項`;
        }

        function updateCurrentWheelTitle(val) {
            wheels[currentEditingIndex].title = val || '未命名轉盤';
            document.getElementById(`wheelTitle${currentEditingIndex}`).innerText = wheels[currentEditingIndex].title;
        }

        function updateCurrentWheelItems(text) {
            const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            wheels[currentEditingIndex].items = lines;
            document.getElementById('itemCountBadge').innerText = `${lines.length} 個選項`;
        }

        function resetAlphabetPresets() {
            wheels[0].title = '大寫字母 (A-Z)';
            wheels[0].items = [...UPPER_ALPHABET];

            wheels[1].title = '小寫字母 (a-z)';
            wheels[1].items = [...LOWER_ALPHABET];

            document.getElementById('wheelTitle0').innerText = wheels[0].title;
            document.getElementById('wheelTitle1').innerText = wheels[1].title;

            switchEditingWheel(currentEditingIndex);
        }

        function loadFoodPresets() {
            const foods = ['漢堡', '薯條', '披薩', '炸雞', '奶茶', '拉麵'];
            wheels[0].title = '午餐吃什麼';
            wheels[0].items = [...foods];

            wheels[1].title = '晚餐吃什麼';
            wheels[1].items = [...foods];

            document.getElementById('wheelTitle0').innerText = wheels[0].title;
            document.getElementById('wheelTitle1').innerText = wheels[1].title;

            switchEditingWheel(currentEditingIndex);
        }

        function toggleSound() {
            soundEngine.enabled = !soundEngine.enabled;
            const icon = document.getElementById('soundIcon');
            const text = document.getElementById('soundStatusText');

            if (soundEngine.enabled) {
                icon.className = 'fa-solid fa-volume-high text-cyan-300';
                text.innerText = '可愛音效';
            } else {
                icon.className = 'fa-solid fa-volume-xmark text-slate-400';
                text.innerText = '靜音';
            }
        }

        // Initialize Animation Loop
        window.onload = function() {
            updateAnimationLoop();
        };
    </script>
</body>
</html>
